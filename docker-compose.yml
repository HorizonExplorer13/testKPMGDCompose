volumes:
        sql-intance-volume:
            driver: local
services:
    sql_service:
        build:  
            context: ../testKPMGDCompose/sqlinstance
            dockerfile: dockerfile
        image: sqlintance:latest
        container_name: Sql_KPMGInstance
        environment:
            - ACCEPT_EULA="Y"
            - MSSQL_SA_PASSWORD=${DB_PASSWORD}
            - MSSQL_PID=Developer
        ports:
            - "1468:1433"
        volumes:
            - sql-intance-volume:/var/opt/mssql
        restart: unless-stopped
    kpmg_back_service:
        build:
            context: ../testKPMG/testKPMG/testKPMG
            dockerfile: Dockerfile
        image: kpmg_back:latest
        container_name: KPMG_Back
        depends_on:
                - sql_service
        environment:
            - ConnectionStrings__DefaultConnection=Server=sql_service;Database=${DB_DATABASE};User Id=sa;Password=vInKeWyAGkEmkzqgcxHrblEzHART+aj5RsANS02nFHk=;Encrypt=False;TrustServerCertificate=True;
        ports:
                - "8000:8080"
                - "8001:8081"
        restart: always
    react_kpmg_service:
        build: 
            context: ../testKPMGFront/testkpmg-ts
            dockerfile: Dockerfile
        image: kpmg_front:latest
        container_name: KPMG_Front
        depends_on:
                - kpmg_back_service
        environment:
            - VITE_AYCE_API_BASE_URL=http://kpmg_back_service:8080
        ports:
                - "3000:80"
        restart: unless-stopped
